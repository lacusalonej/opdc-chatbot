<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการสนทนา | OPDC Chatbot Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span>🛡️</span> OPDC Chatbot Admin
    </div>
    <div class="user-info">
      <span id="nav-user" style="display:none;"></span>
      <span id="nav-role" class="badge-role" style="display:none;"></span>
      <button id="nav-logout-btn" class="btn btn-danger btn-sm" style="display:none;">ออกจากระบบ</button>
    </div>
  </header>

  <nav class="app-nav">
    <a href="dashboard.html" data-auth-required>แดชบอร์ด</a>
    <a href="knowledge.html" data-auth-required>จัดการความรู้</a>
    <a href="intents.html" data-auth-required>จัดการ Intent</a>
    <a href="prompts.html" data-auth-required>ตั้งค่า Prompt</a>
    <a href="conversations.html" data-auth-required class="active">ประวัติการสนทนา</a>
    <a href="system.html" data-auth-required>ระบบและรายงาน</a>
    <a href="login.html" id="nav-login-btn">เข้าสู่ระบบ</a>
  </nav>

  <main class="app-main">
    <div id="conversationsStatus" class="status"></div>

    <h1 class="page-title" data-auth-required>ประวัติการสนทนา</h1>
    <p class="page-subtitle" data-auth-required>ดูและจัดการประวัติการสนทนาระหว่างผู้ใช้กับ Chatbot (ตามนโยบาย PDPA สามารถลบได้)</p>

    <div class="card" data-auth-required>
      <div class="card-header">
        <h3>รายการประวัติ (<span id="convTotal">0</span>)</h3>
      </div>
      <div class="card-body">
        <div id="convList" class="loading">กำลังโหลดรายการ...</div>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    (function () {
      const listEl = document.getElementById('convList');
      const totalEl = document.getElementById('convTotal');
      const statusEl = document.getElementById('conversationsStatus');

      async function loadConversations() {
        listEl.innerHTML = '<div class="loading">กำลังโหลดประวัติการสนทนา...</div>';
        try {
          const res = await window.AdminApp.apiRequest('/conversations');
          if (res && res.ok) {
            const convs = res.data.conversations || [];
            totalEl.textContent = res.data.total || 0;
            if (convs.length === 0) {
              listEl.innerHTML = '<div class="empty">ยังไม่มีประวัติการสนทนา</div>';
              return;
            }
            let html = '<table><thead><tr><th>เวลา</th><th>Session ID</th><th>ข้อความผู้ใช้</th><th>Intent</th><th style="width:110px;">การดำเนินการ</th></tr></thead><tbody>';
            convs.forEach((c) => {
              const time = (c.created_at || '').slice(0, 16).replace('T', ' ');
              html += '<tr>' +
                '<td>' + window.AdminApp.escapeHtml(time) + '</td>' +
                '<td><code>' + window.AdminApp.escapeHtml(c.session_id || '-') + '</code></td>' +
                '<td>' + window.AdminApp.escapeHtml((c.user_message || '').slice(0, 80)) + (c.user_message && c.user_message.length > 80 ? '…' : '') + '</td>' +
                '<td><code>' + window.AdminApp.escapeHtml(c.intent || '-') + '</code></td>' +
                '<td class="actions">' +
                  '<button class="btn btn-danger btn-sm" data-action="delete-conv" data-id="' + window.AdminApp.escapeHtml(c.id) + '" title="ลบรายการนี้">ลบ</button>' +
                '</td>' +
              '</tr>';
            });
            html += '</tbody></table>';
            listEl.innerHTML = html;

            listEl.querySelectorAll('[data-action="delete-conv"]').forEach((btn) => {
              btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                if (!confirm('ยืนยันลบประวัติการสนทนา id=' + id + ' หรือไม่? (ตามนโยบาย PDPA)')) return;
                try {
                  const res = await window.AdminApp.apiRequest('/conversations/' + id, { method: 'DELETE' });
                  if (res && res.ok) {
                    window.AdminApp.showStatus('conversationsStatus', 'ลบประวัติการสนทนาแล้ว', 'success');
                    loadConversations();
                  }
                } catch (err) {
                  window.AdminApp.showStatus('conversationsStatus', err.message || 'ลบไม่สำเร็จ', 'error');
                }
              });
            });
          }
        } catch (err) {
          listEl.innerHTML = '<div class="status error show">โหลดรายการไม่สำเร็จ: ' + window.AdminApp.escapeHtml(err.message) + '</div>';
        }
      }

      loadConversations();
    })();
  </script>
</body>
</html>
