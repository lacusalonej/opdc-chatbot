<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการ Intent | OPDC Chatbot Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span>🛡️</span> OPDC Chatbot Admin
    </div>
    <div class="user-info">
      <span id="nav-user" style="display:none;"></span>
      <span id="nav-role" class="badge-role" style="display:none;"></span>
      <button id="nav-logout-btn" class="btn btn-danger btn-sm" style="display:none;" data-action="logout">ออกจากระบบ</button>
    </div>
  </header>

  <div class="app-body">
    <nav class="app-nav">
    <a href="dashboard.html" data-auth-required>ภาพรวม</a>
    <a href="knowledge.html" data-auth-required>จัดการความรู้</a>
    <a href="intents.html" data-auth-required class="active">จัดการ Intent</a>
    <a href="prompts.html" data-auth-required>ตั้งค่า Prompt</a>
    <a href="conversations.html" data-auth-required>ประวัติการสนทนา</a>
    <a href="system.html" data-auth-required>ระบบและรายงาน</a>
    <a href="login.html" id="nav-login-btn">เข้าสู่ระบบ</a>
  </nav>

  <main class="app-main">
    <div id="intentsStatus" class="status"></div>

    <div class="page-header" data-auth-required>
      <div class="greeting">
        <div class="hello">จัดการหมวดหมู่ Intent</div>
        <div class="name">รายการ Intent ทั้งหมดที่ Chatbot สามารถจำแนกได้</div>
      </div>
      <nav class="pill-nav" aria-label="นำทางหลัก">
        <a href="dashboard.html">ภาพรวม</a>
        <a href="knowledge.html">ฐานความรู้</a>
        <a href="conversations.html">แหล่งข้อมูล</a>
        <a href="system.html">กิจกรรม</a>
      </nav>
      <div class="actions"></div>
    </div>

    <div class="card" data-auth-required>
      <div class="card-header">
        <h3>รายการ Intent (<span id="intentTotal">0</span>)</h3>
      </div>
      <div class="card-body">
        <div id="intentList" class="loading">กำลังโหลดรายการ...</div>
      </div>
    </div>
  </main>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    (function () {
      const listEl = document.getElementById('intentList');
      const totalEl = document.getElementById('intentTotal');

      async function loadIntents() {
        listEl.innerHTML = '<div class="loading">กำลังโหลดรายการ Intent...</div>';
        try {
          const res = await window.AdminApp.apiRequest('/intents');
          if (res && res.ok) {
            const intents = res.data.intents || [];
            totalEl.textContent = intents.length;
            if (intents.length === 0) {
              listEl.innerHTML = '<div class="empty">ไม่พบ Intent ในระบบ</div>';
              return;
            }
            let html = '<table><thead><tr><th>รหัส Intent</th><th>คำอธิบาย (ภาษาไทย)</th></tr></thead><tbody>';
            intents.forEach((it) => {
              html += '<tr>' +
                '<td><code>' + window.AdminApp.escapeHtml(it.id) + '</code></td>' +
                '<td>' + window.AdminApp.escapeHtml(it.name_th || it.id) + '</td>' +
              '</tr>';
            });
            html += '</tbody></table>';
            listEl.innerHTML = html;
          }
        } catch (err) {
          listEl.innerHTML = '<div class="status error show">โหลดรายการไม่สำเร็จ: ' + window.AdminApp.escapeHtml(err.message) + '</div>';
        }
      }

      loadIntents();
    })();
  </script>
</body>
</html>
