<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOF Chatbot - ทดสอบ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1e3c72;
      --primary-dark: #142740;
      --primary-light: #2a5298;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --user-bg: #1e3c72;
      --user-text: #ffffff;
      --bot-bg: #f1f5f9;
      --bot-text: #1e293b;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
      --accent: #0f62fe;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Sarabun', 'Noto Sans Thai', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 760px;
      height: 90vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #ffffff;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .header-info h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-info p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      opacity: 0.9;
      padding: 0 4px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-online { background: #22c55e; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.3); }
    .status-offline { background: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3); }
    .status-checking { background: #f59e0b; }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg);
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: fadeIn 0.3s ease;
      position: relative;
      word-wrap: break-word;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--bot-text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .message.error {
      align-self: flex-start;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #fecaca;
    }

    .message.system {
      align-self: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      padding: 8px 16px;
      text-align: center;
      max-width: 100%;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .msg-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
      opacity: 0.6;
      transition: opacity 0.2s, background 0.2s;
    }

    .msg-btn:hover { opacity: 1; background: rgba(0,0,0,0.05); }

    .message-user .msg-btn { color: rgba(255,255,255,0.7); }
    .message-user .msg-btn:hover { color: #ffffff; background: rgba(255,255,255,0.15); }
    .message-bot .msg-btn { color: var(--text-muted); }
    .message-bot .msg-btn:hover { color: var(--accent); background: rgba(15, 98, 254, 0.1); }

    .meta {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 6px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timestamp { font-variant-numeric: tabular-nums; }

    .intent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .intent-badge.org { background: #dbeafe; color: #1e40af; }
    .intent-badge.service { background: #dcfce7; color: #166534; }
    .intent-badge.event { background: #fef3c7; color: #92400e; }
    .intent-badge.link { background: #e0e7ff; color: #3730a3; }
    .intent-badge.insufficient { background: #fee2e2; color: #991b1b; }

    .evidence-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
    }

    .evidence-true { color: #166534; }
    .evidence-false { color: #991b1b; }

    .sources-hint {
      font-size: 0.7rem;
      color: var(--accent);
      font-style: italic;
      margin-top: 4px;
    }

    /* Quick Questions */
    .quick-questions {
      padding: 0 24px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .quick-btn {
      padding: 8px 14px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }

    .quick-btn:hover { background: #e2e8f0; border-color: #94a3b8; color: var(--primary); }
    .quick-btn:active { transform: scale(0.97); }

    /* Input Area */
    .input-area {
      padding: 18px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrapper { flex: 1; position: relative; }

    #messageInput {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid var(--border);
      border-radius: 28px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      background: var(--bg);
    }

    #messageInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.1);
    }

    #messageInput:disabled { background: #e2e8f0; cursor: not-allowed; }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 28px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30, 60, 114, 0.3);
    }

    .btn-primary:active:not(:disabled) { transform: translateY(0); }

    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; }

    .btn-outline:disabled { opacity: 0.6; cursor: not-allowed; }

    .loading {
      display: inline-flex;
      gap: 4px;
    }

    .loading span {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading span:nth-child(1) { animation-delay: -0.32s; }
    .loading span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Session Info */
    .session-info {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .session-info code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--accent);
    }

    /* Mobile */
    @media (max-width: 640px) {
      body { padding: 8px; align-items: stretch; }
      .chat-container { height: 100vh; border-radius: 0; }
      .message { max-width: 85%; }
      .header { padding: 16px 20px; }
      .messages { padding: 16px; }
      .input-area { padding: 14px 20px; }
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 24px;
    }

    .empty-state svg { width: 64px; height: 64px; opacity: 0.3; margin-bottom: 16px; }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
    .empty-state p { font-size: 0.9rem; line-height: 1.5; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Typing indicator */
    .typing-indicator {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="header-top">
        <div class="bot-icon">🤖</div>
        <div class="header-info">
          <h1>MOF Chatbot</h1>
          <p>สำนักงานปลัดกระทรวงการคลัง (สปก.) • ระบบตอบคำถามอัตโนมัติ</p>
        </div>
      </div>
      <div class="status-bar">
        <div class="status-item">
          <span class="status-dot status-checking" id="statusDot"></span>
          <span id="serverStatus">กำลังตรวจสอบเซิร์ฟเวอร์...</span>
        </div>
        <div class="status-item">
          <span>Session: <span id="sessionId">—</span></span>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <!-- ข้อความจะปรากฏตรงนี้ -->
    </div>

    <div class="quick-questions" id="quickQuestions">
      <!-- คำถามเร็วจะปรากฏตรงนี้ -->
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input
          type="text"
          id="messageInput"
          placeholder="พิมพ์คำถามของคุณที่นี่… (เช่น สปก. คืออะไร, วิสัยทัศน์ของ สปก., เบอร์ติดต่อ)"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button class="btn btn-outline" id="clearBtn" title="ล้างการสนทนา" onclick="clearConversation()">
        🗑️
      </button>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">
        <span id="btnText">ส่ง</span>
        <span class="loading" id="btnLoading" style="display:none;"><span></span><span></span><span></span></span>
      </button>
    </div>

    <div class="session-info">
      วิธีรัน: <code>cd backend && node server.js</code> | พอร์ต: 8001 | <a href="index.html" style="color: var(--accent); text-decoration: underline;">กลับหน้าหลัก</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== CONFIG =====
    const API_BASE = 'http://localhost:8001';
    let sessionId = null;
    let isWaiting = false;
    let messageCount = 0;

    // ===== DOM =====
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const clearBtn = document.getElementById('clearBtn');
    const statusDot = document.getElementById('statusDot');
    const serverStatus = document.getElementById('serverStatus');
    const sessionIdEl = document.getElementById('sessionId');
    const quickQuestionsEl = document.getElementById('quickQuestions');
    const toastEl = document.getElementById('toast');

    // ===== Quick Questions =====
    const quickQuestions = [
      'สปก. คืออะไร',
      'วิสัยทัศน์ของ สปก.',
      'ภารกิจของ สปก.',
      'เบอร์โทรศัพท์ สปก.',
      'อีเมล สปก.',
      'ที่อยู่สำนักงาน',
      'บริการมีอะไรบ้าง',
      'คณะกรรมการมีกี่คณะ',
      'ยุทธศาสตร์มีอะไรบ้าง',
      'ศูนย์ความรู้มีอะไรบ้าง',
      'What is MOF?',
      'ขอข้อมูลนอกขอบเขตหน่อย'
    ];

    function renderQuickQuestions() {
      quickQuestionsEl.innerHTML = quickQuestions.map(q =>
        `<button class="quick-btn" type="button" onclick="setQuickQuestion('${q.replace(/'/g, "\\'")}')">${escapeHtml(q)}</button>`
      ).join('');
    }

    function setQuickQuestion(q) {
      inputEl.value = q;
      inputEl.focus();
    }

    // ===== Utilities =====
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime() {
      const now = new Date();
      return now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(message, type = 'info') {
      toastEl.textContent = message;
      toastEl.className = 'toast show';
      setTimeout(() => { toastEl.className = 'toast'; }, 3000);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('คัดลอกข้อความแล้ว');
      }).catch(() => {
        showToast('ไม่สามารถคัดลอกได้');
      });
    }

    // ===== Add Message =====
    function addMessage(role, content, meta = {}) {
      const div = document.createElement('div');
      const isUser = role === 'user';
      const isBot = role === 'bot';
      const isError = role === 'error';
      const isSystem = role === 'system';

      div.className = `message ${role}`;

      const time = formatTime();
      let html = `<div class="message-content">`;
      html += `<div class="message-text">${escapeHtml(content)}</div>`;

      // Actions (copy for bot, system messages)
      if (isBot || isError) {
        html += `<div class="message-actions">`;
        html += `<button class="msg-btn" type="button" title="คัดลอก" onclick="copyToClipboard(${JSON.stringify(content)})">📋</button>`;
        html += `</div>`;
      }

      html += `</div>`;

      // Meta
      let metaHtml = '';
      if (meta.timestamp) {
        metaHtml += `<span class="timestamp">${meta.timestamp}</span>`;
      } else {
        metaHtml += `<span class="timestamp">${time}</span>`;
      }
      if (meta.intent) {
        const intentClass = (meta.intent || '').toLowerCase().includes('org') ? 'org' :
                           (meta.intent || '').toLowerCase().includes('service') ? 'service' :
                           (meta.intent || '').toLowerCase().includes('event') ? 'event' :
                           (meta.intent || '').toLowerCase().includes('link') ? 'link' : 'insufficient';
        metaHtml += `<span class="intent-badge ${intentClass}">${escapeHtml(meta.intent)}</span>`;
      }
      if (meta.insufficientEvidence !== undefined) {
        metaHtml += `<span class="evidence-indicator ${meta.insufficientEvidence ? 'evidence-false' : 'evidence-true'}">`;
        metaHtml += meta.insufficientEvidence ? '⚠️ ข้อมูลไม่เพียงพอ' : '✅ มีหลักฐานครบ';
        metaHtml += `</span>`;
      }
      if (meta.sources && meta.sources.length > 0) {
        metaHtml += `<span class="sources-hint">📚 อ้างอิงจาก ${meta.sources.length} แหล่งข้อมูล</span>`;
      }

      if (metaHtml) {
        html += `<div class="meta">${metaHtml}</div>`;
      }

      div.innerHTML = html;
      messagesEl.appendChild(div);
      messageCount++;
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystemMessage(text) {
      return addMessage('system', text, { timestamp: formatTime() });
    }

    function addTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.id = 'typingIndicator';
      div.textContent = 'กำลังพิมพ์ตอบกลับ…';
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // ===== Send Message =====
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isWaiting) return;

      isWaiting = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline-flex';

      addMessage('user', text, { timestamp: formatTime() });
      inputEl.value = '';

      const typingEl = addTypingIndicator();

      try {
        const body = { message: text };
        if (sessionId) body.session_id = sessionId;

        const res = await fetch(`${API_BASE}/v1/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.session_id) {
          sessionId = data.session_id;
          sessionIdEl.textContent = sessionId.slice(0, 8) + '...';
        }

        removeTypingIndicator();

        if (!res.ok) {
          addMessage('error', `❌ เกิดข้อผิดพลาด ${res.status}: ${data.detail || data.error || 'ข้อผิดพลาดไม่ทราบสาเหตุ'}`, { timestamp: formatTime() });
        } else {
          addMessage('bot', data.answer || '(ไม่มีคำตอบ)', {
            timestamp: formatTime(),
            intent: data.intent || null,
            insufficientEvidence: data.insufficient_evidence || null,
            sources: data.sources || null
          });
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage('error', `❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ${err.message}`, { timestamp: formatTime() });
      } finally {
        isWaiting = false;
        inputEl.disabled = false;
        sendBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        inputEl.focus();
      }
    }

    // ===== Clear Conversation =====
    function clearConversation() {
      if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างการสนทนาทั้งหมด?')) return;
      messagesEl.innerHTML = '';
      messageCount = 0;
      sessionId = null;
      sessionIdEl.textContent = '—';
      addSystemMessage('การสนทนาถูกล้างแล้ว เริ่มต้นใหม่ได้เลยครับ');
      showToast('ล้างการสนทนาแล้ว');
    }

    // ===== Enter key & Ctrl+Enter =====
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize input on multiple lines not needed (single line input)

    // ===== Check Server =====
    async function checkServer() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        statusDot.className = 'status-dot status-online';
        serverStatus.textContent = 'ออนไลน์ ✅';
        if (data.knowledgeCount) {
          serverStatus.textContent += ` | ฐานความรู้ ${data.knowledgeCount} รายการ`;
        }
      } catch (err) {
        statusDot.className = 'status-dot status-offline';
        serverStatus.textContent = 'ออฟไลน์ ❌';
      }
    }

    // ===== Init =====
    renderQuickQuestions();
    checkServer();
    setInterval(checkServer, 30000);

    // Welcome message
    addMessage('bot', 'สวัสดีครับ! ผมคือ MOF Chatbot 🤖\nผมพร้อมตอบคำถามเกี่ยวกับสำนักงานปลัดกระทรวงการคลัง (สปก.) ครับ\nลองถามอะไรก็ได้ เช่น "สปก. คืออะไร" หรือ "วิสัยทัศน์ของ สปก."', {
      timestamp: formatTime()
    });
  </script>
</body>
</html>
