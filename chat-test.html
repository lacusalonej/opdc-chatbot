<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPDC Chatbot - ทดสอบ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #ffffff; height: 100vh; display: flex; justify-content: center; padding-top: 20px; }
    .chat-container { width: 100%; max-width: 700px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; height: 90vh; overflow: hidden; }
    .header { background: #ffffff; color: #1a1a2e; padding: 20px; text-align: center; border-bottom: 1px solid #e5e7eb; }
    .header h1 { font-size: 1.3rem; font-weight: 600; }
    .header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }
    .status-bar { display: flex; justify-content: center; gap: 16px; margin-top: 10px; font-size: 0.75rem; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-online { background: #4ade80; }
    .status-offline { background: #f87171; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; background: #1e3c72; color: #ffffff; border-bottom-right-radius: 4px; border: 1px solid #1e3c72; }
    .message.bot { align-self: flex-start; background: #f9fafb; color: #1a1a2e; border-bottom-left-radius: 4px; border: 1px solid #e5e7eb; }
    .message.error { align-self: flex-start; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .message .meta { font-size: 0.7rem; opacity: 0.7; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
                .input-area { padding: 16px 20px; border-top: 1px solid #e5e7eb; background: #ffffff; display: flex; gap: 10px; }
    .input-wrapper { flex: 1; position: relative; }
    #messageInput { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 24px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    #messageInput:focus { border-color: #2a5298; }
    #messageInput:disabled { background: #f3f4f6; cursor: not-allowed; }
    .btn { padding: 12px 24px; border: none; border-radius: 24px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30, 60, 114, 0.3); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .quick-questions { padding: 0 20px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .quick-btn { padding: 8px 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 20px; font-size: 0.8rem; color: #374151; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .quick-btn:hover { background: #f0f2f5; border-color: #d1d5db; color: #1a1a2e; }
    .loading { display: inline-flex; gap: 4px; }
    .loading span { width: 6px; height: 6px; background: #9ca3af; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .loading span:nth-child(1) { animation-delay: -0.32s; }
    .loading span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    .session-info { font-size: 0.7rem; color: #6b7280; text-align: center; padding: 8px 0; border-top: 1px solid #f0f0f0; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h1>🤖 OPDC Chatbot - ทดสอบ</h1>
      <p>สำนักงาน ก.พ.ร. | API: <span id="apiUrl">http://localhost:8001</span></p>
      <div class="status-bar">
        <span><span class="status-dot" id="statusDot"></span>เซิร์ฟเวอร์: <span id="serverStatus">เช็ค중...</span></span>
        <span>Session: <span id="sessionId">-</span></span>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-questions" id="quickQuestions"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="พิมพ์คำถามที่นี่... (เช่น: ก.พ.ร. คืออะไร, วิสัยทัศน์ของ ก.พ.ร.)" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">
        <span id="btnText">ส่ง</span>
        <span class="loading" id="btnLoading" style="display:none;"><span></span><span></span><span></span></span>
      </button>
    </div>

    <div class="session-info">
      รันเซิร์ฟเวอร์: <code>cd backend && node server.js</code> | พอร์ตค่าเริ่มต้น: 8001
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const API_BASE = 'http://localhost:8001';
    let sessionId = null;
    let isWaiting = false;

    // ===== DOM =====
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const statusDot = document.getElementById('statusDot');
    const serverStatus = document.getElementById('serverStatus');
    const sessionIdEl = document.getElementById('sessionId');
    const quickQuestionsEl = document.getElementById('quickQuestions');
    const apiUrlEl = document.getElementById('apiUrl');

    apiUrlEl.textContent = API_BASE;

    // ===== Quick Questions =====
    const quickQuestions = [
      'ก.พ.ร. คืออะไร',
      'วิสัยทัศน์ของ ก.พ.ร.',
      'ภารกิจของ ก.พ.ร.',
      'เบอร์โทรศัพท์ ก.พ.ร.',
      'อีเมล ก.พ.ร.',
      'ที่อยู่สำนักงาน',
      'บริการมีอะไรบ้าง',
      'คณะกรรมการมีกี่คณะ',
      'ยุทธศาสตร์มีอะไรบ้าง',
      'ศูนย์ความรู้มีอะไรบ้าง',
      'What is OPDC?',
      'ขอข้อมูลนอกขอบเขตหน่อย'
    ];

    function renderQuickQuestions() {
      quickQuestionsEl.innerHTML = quickQuestions.map(q =>
        `<button class="quick-btn" onclick="setQuickQuestion('${q.replace(/'/g, "\\'")}')">${q}</button>`
      ).join('');
    }

    function setQuickQuestion(q) {
      inputEl.value = q;
      inputEl.focus();
    }

    // ===== Add Message =====
    function addMessage(role, content, meta = {}) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      let html = `<div>${escapeHtml(content)}</div>`;
      if (false) {
        html += '<div class="meta">';
        if (meta.intent) html += `<span class="intent-badge">${meta.intent}</span>`;
        if (meta.insufficientEvidence !== undefined) {
          html += `<span class="${meta.insufficientEvidence ? 'evidence-false' : 'evidence-true'}">📋 ${meta.insufficientEvidence ? 'ข้อมูลไม่เพียงพอ' : 'มีหลักฐานครบ'}</span>`;
        }
        html += '</div>';
      }
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== Send Message =====
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isWaiting) return;

      isWaiting = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline-flex';

      addMessage('user', text);
      inputEl.value = '';

      try {
        const body = { message: text };
        if (sessionId) body.session_id = sessionId;

        const res = await fetch(`${API_BASE}/v1/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.session_id) {
          sessionId = data.session_id;
          sessionIdEl.textContent = sessionId.slice(0, 8) + '...';
        }

        if (!res.ok) {
          addMessage('error', `❌ Error ${res.status}: ${data.detail || data.error || 'Unknown error'}`, {});
        } else {
          addMessage('bot', data.answer || '(ไม่มีคำตอบ)', {
            sources: data.sources
          });
        }
      } catch (err) {
        addMessage('error', `❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ${err.message}`);
      } finally {
        isWaiting = false;
        inputEl.disabled = false;
        sendBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        inputEl.focus();
      }
    }

    // ===== Enter key =====
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ===== Check Server =====
    async function checkServer() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        statusDot.className = 'status-dot status-online';
        serverStatus.textContent = 'ออนไลน์ ✅';
        if (data.knowledgeCount) {
          serverStatus.textContent += ` | ข้อมูล ${data.knowledgeCount} รายการ`;
        }
      } catch (err) {
        statusDot.className = 'status-dot status-offline';
        serverStatus.textContent = 'ออฟไลน์ ❌';
      }
    }

    // ===== Init =====
    renderQuickQuestions();
    checkServer();
    setInterval(checkServer, 30000); // เช็คทุก 30 วิ

    // Welcome message
    addMessage('bot', 'สวัสดีครับ! ผมคือ OPDC Chatbot 🤖\nลองถามอะไรก็ได้ เช่น "ก.พ.ร. คืออะไร" หรือ "วิสัยทัศน์ของ ก.พ.ร."', {});
  </script>
</body>
</html>
